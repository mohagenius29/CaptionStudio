name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CaptionStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CaptionStudio-apk
          path: CaptionStudio.apk
      - name: Move the "latest" tag to this commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
      - name: Publish public download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Caption Studio (latest build)
          body: Latest debug build. Download CaptionStudio.apk and install it.
          files: CaptionStudio.apk
